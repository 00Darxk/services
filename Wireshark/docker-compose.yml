services:
  wireshark:
    image: lscr.io/linuxserver/wireshark:latest
    container_name: wireshark
    cap_add:
      - NET_ADMIN
    network_mode: service:tailscale-wireshark
    depends_on:
      tailscale-wireshark:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    volumes:
      - ${PWD}/config:/config
#    ports:
#      - 3000:3000 #optional
#      - 3001:3001 #optional
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "http://localhost:3001"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks

  tailscale-wireshark:
    image: tailscale/tailscale:latest
    container_name: tailscale-wireshark
    environment:
      - TS_AUTHKEY=${TS_KEY_WIRESHARK}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_SERVE_CONFIG=/config/wireshark.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=wireshark
      # - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234       # The <addr>:<port> for the healthz endpoint
    volumes:
      - ${PWD}/tailscale-wireshark/state:/var/lib/tailscale
      - ${PWD}/tailscale-wireshark/config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    network_mode: host
    # networks:
    #  - ...
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: unless-stopped
