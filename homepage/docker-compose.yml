services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
#   ports:
#     - 3000:3000
    volumes:
      - ${PWD}/app/config:/app/config # Make sure your local config directory exists
      - ${PWD}/app/public/image:/app/public/image
      - ${PWD}/app/public/icons:/app/public/icons
      - /var/run/docker.sock:/var/run/docker.sock:ro # (optional) For docker integrations
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${TS_HOST} # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
    network_mode: service:tailscale-homepage
    healthcheck:
      test: ["CMD", "wget", "http://localhost:3000"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: unless-stopped


  tailscale-homepage:
    image: tailscale/tailscale:latest
    container_name: tailscale-homepage
    environment:
      - TS_AUTHKEY=${TS_KEY_HOMEPAGE}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_SERVE_CONFIG=/config/homepage.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=homepage
      # - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234       # The <addr>:<port> for the healthz endpoint
    volumes:
      - ${PWD}/tailscale-homepage/state:/var/lib/tailscale
      - ${PWD}/tailscale-homepage/config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    network_mode: host
    # networks:
    #  - ...
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: unless-stopped

