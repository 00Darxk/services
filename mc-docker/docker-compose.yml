#version: '4.2'

services:      
  minecraft-server-fabric:
    container_name: 'minecraft-server-fabric'
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    ports:
      - 25565:25565
      - 25575:25575
      - 8080:8080
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      MODS: |
        https://cdn.modrinth.com/data/P7dR8mSH/versions/SQv5lrom/fabric-api-0.124.2%2B1.21.5.jar
        https://cdn.modrinth.com/data/uXXizFIs/versions/CtMpt7Jr/ferritecore-8.0.0-fabric.jar
        https://cdn.modrinth.com/data/gvQqBUqZ/versions/VWYoZjBF/lithium-fabric-0.16.2%2Bmc1.21.5.jar
        https://cdn.modrinth.com/data/VSNURh3q/versions/eL3rprSq/c2me-fabric-mc1.21.5-0.3.2.0.0.jar
        https://cdn.modrinth.com/data/KuNKN7d2/versions/sUh67T4Y/noisium-fabric-2.6.0%2Bmc1.21.5.jar
        https://cdn.modrinth.com/data/fQEb0iXm/versions/neW85eWt/krypton-0.2.9.jar
        https://cdn.modrinth.com/data/vSEH1ERy/versions/IvtlnXcT/threadtweak-fabric-0.1.7%2Bmc1.21.5.jar
        https://cdn.modrinth.com/data/YS3ZignI/versions/MjGahcCF/tt20-0.7.1%2Bmc1.21.2.jar
        https://cdn.modrinth.com/data/ksm6XRZ9/versions/FQF35QhU/slumber-1.3.0.jar
        https://cdn.modrinth.com/data/7LEWYKTV/versions/oe5KEgWu/RecipeCooldown-1.0.0.jar
      PLUGINS: |
        https://cdn.modrinth.com/data/PFb7ZqK6/versions/5kfF5ulQ/squaremap-fabric-mc1.21.5-1.3.6.jar
      COPY_MODS_SRC: ./mods
      INIT_MEMORY: '2G'
      MAX_MEMORY: '7G'
      RCON_ENABLE: "TRUE"
      RCON_PASSWORD: ${RCON_PASSWORD}
    restart: on-failure:3
    volumes:
      - ./data:/data
      - ./mods:/data/mods
      - ./plugins:/data/plugins

