    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./seerr/appdata/config:/app/config
    restart: unless-stopped
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1 # Check if ${SERVICE} process is running
