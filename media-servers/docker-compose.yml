    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    # hostname: seerr.internal
    network_mode: service:tailscale-seerr
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Rome
      - PORT=5055 #optional
    # ports:
    #   - 5055:5055
    depends_on:
      tailscale-seerr:
