services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    # hostname: jellyfin.internal
    # Optional - specify the uid and gid you would like Jellyfin to use instead of root
    # user: uid:gid
    # ports:
    #   - 8096:8096/tcp
    #   - 7359:7359/udp
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - type: bind
        source: ./data/media
        target: /data/media
      - type: bind
        source: ./data/media2
        target: /data/media2
        read_only: true
      # Optional - extra fonts to be used during transcoding with subtitle burn-in
      - type: bind
        source: ./jellyfin/fonts
        target: /usr/local/share/fonts/custom
        read_only: true
    restart: 'unless-stopped'
    # Optional - alternative address used for autodiscovery
    # environment:
    #   - JELLYFIN_PublishedServerUrl=http://example.com
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    # extra_hosts:
    #   - 'host.docker.internal:host-gateway'
    #
    network_mode: service:tailscale-jellyfin
    # networks:
    #   - jellyfin-internal
    depends_on:
      tailscale-jellyfin:
        condition: service_healthy
      seerr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "jellyfin"] # Check if ${SERVICE} process is running
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 30s # Time to wait before starting health checks

  tailscale-jellyfin:
    container_name: tailscale-jellyfin
    image: tailscale/tailscale:latest
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_KEY_JELLYFIN}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_SERVE_CONFIG=/config/jellyfin.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=jellyfin
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41231       # The <addr>:<port> for the healthz endpoint
    volumes:
      - ${PWD}/tailscale-jellyfin/state:/var/lib/tailscale
      - ${PWD}/tailscale-jellyfin/config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    # network_mode: host
    networks:
      - jellyfin-to-seerr
      - bazarr-to-jellyfin
      - jellyfin-bridge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41231/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks



  tailscale-seerr:
    image: tailscale/tailscale:latest
    container_name: tailscale-seerr
    environment:
      - TS_AUTHKEY=${TS_KEY_SEERR}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_SERVE_CONFIG=/config/seerr.json
      - TS_STATE_DIR=/var/lib/tailscale
