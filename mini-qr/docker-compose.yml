---
services:
  mini-qr:
    image: ghcr.io/lyqht/mini-qr:latest
    container_name: mini-qr
    hostname: mini-qr
    restart: unless-stopped
    # Uncomment the following lines to build locally instead of pulling from ghcr.io
#    build:
#      context: .
#      dockerfile: Dockerfile
#      args:
#        - BASE_PATH=${BASE_PATH:-/mini-qr/}
#        - VITE_HIDE_CREDITS=${HIDE_CREDITS:-false}
#        - VITE_DEFAULT_PRESET=${DEFAULT_PRESET:-}
#        - VITE_DEFAULT_DATA_TO_ENCODE=${DEFAULT_DATA:-}
#        - VITE_QR_CODE_PRESETS=${PRESETS:-}
#        - VITE_FRAME_PRESET=${FRAME_PRESET:-}
#        - VITE_FRAME_PRESETS=${FRAME_PRESETS:-}
#        - VITE_DISABLE_LOCAL_STORAGE=${DISABLE_LOCAL_STORAGE:-false}
#    volumes:
#       - ./public:/usr/share/nginx/html/public:ro
#       - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mini-qr-network-internal
#    network_mode: service:tailscale-mini-qr
    depends_on:
      tailscale-mini-qr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks

  tailscale-mini-qr:
    image: tailscale/tailscale:latest
    container_name: tailscale-mini-qr
    environment:
      - TS_AUTHKEY=${TS_KEY_MINI_QR}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_SERVE_CONFIG=/config/mini-qr.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=mini-qr
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234       # The <addr>:<port> for the healthz endpoint
    volumes:
      - ${PWD}/tailscale-mini-qr/state:/var/lib/tailscale
      - ${PWD}/tailscale-mini-qr/config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      - mini-qr-network-internal
      - mini-qr-network-bridge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: unless-stopped

networks:
  mini-qr-network-internal:
    internal: true
  mini-qr-network-bridge:
    driver: bridge





