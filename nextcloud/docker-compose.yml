services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - ${PWD}/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    networks:
      - nextcloud-internal
    hostname: db
    container_name: nextcloud-db 


  app:
    image: nextcloud
    restart: unless-stopped
    ports:
      - 8080:80
    depends:
      db:
        condition: service_started
      tailscale-nextcloud: 
        condition: service_healthy
    volumes:
      - ${PWD}/nextcloud:/var/www/html
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
    networks:
      - nextcloud-internal
    hostname: nextcloud-internal
    container_name: nextcloud-app

 tailscale-nextcloud:
    image: tailscale/tailscale:latest
    container_name: tailscale-nextcloud
    environment:
      - TS_AUTHKEY=${TS_KEY_NEXTCLOUD}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_SERVE_CONFIG=/config/nextcloud.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=nextcloud
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234       # The <addr>:<port> for the healthz endpoint
    volumes:
      - ${PWD}/nextcloud/tailscale-nextcloud/state:/var/lib/tailscale
      - ${PWD}/tailscale-nextcloud/config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      - nextcloud-internal
      - nextcloud-bridge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: unless-stopped

networks:
  nextcloud-internal:
    internal: true
  nextcloud-bridge:
    driver: bridge
