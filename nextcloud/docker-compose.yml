services:
  nextcloud-db:
    image: mariadb:10.6
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - ${PWD}/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MYSQL_USER=${MYSQL_USER:-nextcloud}
    networks:
      - nextcloud-internal
    hostname: nextcloud-db
    container_name: nextcloud-db
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3


  nextcloud:
    image: nextcloud:${TAG:-35.0.2}-local
    build:
      context: nextcloud
      args:
        TAG: ${TAG:-35.0.2}
    restart: unless-stopped
    depends_on:
      nextcloud-db:
        condition: service_healthy
      tailscale-nextcloud:
        condition: service_healthy
    volumes:
      - ${PWD}/nextcloud/data:/var/www/html
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MYSQL_USER=${MYSQL_USER:-nextcloud}
      - MYSQL_HOST=nextcloud-db
    network_mode: service:tailscale-nextcloud
    container_name: nextcloud-app
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:80"]
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks

  appapi-harp:
    image: ghcr.io/nextcloud/nextcloud-appapi-harp:release
    container_name: appapi-harp
    hostname: appapi-harp.internal
    environment:
      - HP_SHARED_KEY="${HP_SHARED_KEY}"
      - NC_INSTANCE_URL="https://${TS_CERT_DOMAIN}"
      - HP_TRUSTED_PROXY_IPS="100.64.0.0/10" # "${TS_IP}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/harp/appdata/certs:/certs
    depends_on:
      nextcloud:
        condition: service_healthy
    networks:
      - nextcloud-bridge
    restart: unless-stopped

  tailscale-nextcloud:
    image: tailscale/tailscale:v1.104.4
    container_name: tailscale-nextcloud
    environment:
      - TS_AUTHKEY=${TS_KEY_NEXTCLOUD}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_SERVE_CONFIG=/config/nextcloud.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=nextcloud
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234       # The <addr>:<port> for the healthz endpoint
    volumes:
      - ${PWD}/tailscale-nextcloud/state:/var/lib/tailscale
      - ${PWD}/tailscale-nextcloud/config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      - nextcloud-internal
      - nextcloud-bridge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: unless-stopped

networks:
  nextcloud-internal:
    internal: true
  nextcloud-bridge:
    driver: bridge
