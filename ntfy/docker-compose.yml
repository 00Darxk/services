services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: ntfy
    network_mode: service:tailscale-ntfy
    command:
      - serve
    environment:
      - TZ=Europe/Rome    # optional: set desired timezone
      - NTFY_BASE_URL=${NTFY_BASE_URL}
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_BEHIND_PROXY=true
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
    # user: UID:GID # optional: replace with your own user/group or uid/gid
    volumes:
      - ${PWD}/var/cache/ntfy:/var/cache/ntfy
      - ${PWD}/var/cache/ntfy/attachements:/var/cache/ntfy/attachements
      - ${PWD}/etc/ntfy:/etc/ntfy
    # ports:
    #   - 80:80
    healthcheck: # optional: remember to adapt the host:port to your environment
        test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
        interval: 60s
        timeout: 10s
        retries: 3
        start_period: 40s
    restart: unless-stopped
    init: true # needed, if healthcheck is used. Prevents zombie processes


  tailscale-ntfy:
    image: tailscale/tailscale:v1.102.5
    container_name: tailscale-ntfy
    environment:
      - TS_AUTHKEY=${TS_KEY_NTFY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_SERVE_CONFIG=/config/ntfy.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=ntfy
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234       # The <addr>:<port> for the healthz endpoint
    volumes:
      - ${PWD}/tailscale-ntfy/state:/var/lib/tailscale
      - ${PWD}/tailscale-ntfy/config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    # networks:
    #  - ...
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: unless-stopped
