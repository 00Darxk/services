# More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
#    ports:
      # DNS Ports
#      - "53:53/tcp"
#      - "53:53/udp"
      # Default HTTP Port
#      - "80:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
#      - "443:443/tcp"
      # Uncomment the line below if you are using Pi-hole as your DHCP server
#      - "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
#      - "123:123/udp"
    depends_on:
      tailscale-pihole:
        condition: service_healthy
      unbound:
        condition: service_healthy
    environment:
      # Set the appropriate timezone for your location (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones), e.g:
      TZ: 'Europe/Rome'
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      # FTLCONF_webserver_api_password: ${API_PASSWORD}
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'ALL'
      FTLCONF_dns_listeningMode: 'ALL'
      FTLCONF_dns_upstreams: 127.0.0.1#5335
    # Volumes store your data between container upgrades
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - './etc-pihole:/etc/pihole'
      # Uncomment the below if you have custom dnsmasq config files that you want to persist. Not needed for most starting fresh with Pi-hole v6. If you're upgrading from v5 you and have used this directory before, you should keep it enabled for the first v6 container start to allow for a complete migration. It can be removed afterwards. Needs environment variable FTLCONF_misc_etc_dnsmasq_d: 'true'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    network_mode: service:tailscale-pihole
    restart: unless-stopped


  tailscale-pihole:
    image: tailscale/tailscale:latest
    container_name: tailscale-pihole
    environment:
      - TS_AUTHKEY=${TS_KEY_PIHOLE}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_SERVE_CONFIG=/config/pihole.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=pihole
      - TS_USERSPACE=true
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234       # The <addr>:<port> for the healthz endpoint
    volumes:
      - ${PWD}/tailscale-pihole/state:/var/lib/tailscale
      - ${PWD}/tailscale-pihole/config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    # networks:
    #   - dns-internal
    #   - pihole-host
    network_mode: host # needs to run in host mode to distinguish tailscale clients
    ports:
      - "${TS_IP}:53:53/tcp"
      - "${TS_IP}:53:53/udp"
      - "${IP}:53:53/tcp"
      - "${IP}:53:53/udp"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: unless-stopped



  unbound:
    build: ./unbound/
    container_name: unbound
    # networks:
    #  - unbound-bridge
    network_mode: service:wireguard-unbound
    volumes:
      - './etc-unbound:/etc/unbound'
    healthcheck:
      test: ["CMD", "pgrep", "-f", "unbound"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped


  wireguard-unbound:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard-unbound
    cap_add:
      - NET_ADMIN
      - SYS_MODULE #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
      # - SERVERURL=wireguard.domain.com #optional
      # - SERVERPORT=51820 #optional
      # - PEERS=1 #optional
      # - PEERDNS=auto #optional
      # - INTERNAL_SUBNET=10.13.13.0 #optional
      # - ALLOWEDIPS=0.0.0.0/0 #optional
      # - PERSISTENTKEEPALIVE_PEERS= #optional
      - LOG_CONFS=true #optional
    volumes:
      - ./wg-conf/wg0.conf:/config/wg0.conf:ro
      - /lib/modules:/lib/modules #optional
    ports:
      - 127.0.0.1:5335:5335/tcp
      - 127.0.0.1:5335:5335/udp
    #   - ${IP}:51820:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

