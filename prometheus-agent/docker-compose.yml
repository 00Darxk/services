services: 
  prometheus-agent:
    image: prom/prometheus:latest
    container_name: prometheus-agent
    command:
#      - "--enable-feature=agent"
      - "--agent"
    restart: unless-stopped
    ports: 
      - ${IP}:9090:9090
      # - ${IP}:9095:9095
    links: 
      - node_exporter
    depends_on:
      node_exporter:
        condition: service_healthy
    volumes: 
      - ${PWD}/prometheus/config/prometheus.yml:/prometheus/prometheus.yml
      - ${PWD}/prometheus/config:/etc/prometheus
      - ${PWD}/prometheus/data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 40s 


  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.systemd"
      - "--collector.processes"
      - "--collector.filesystem.ignored-mount-points"
      - "^/(rootfs/)?(dev|etc|host|proc|run|sys)($$|/)"
    ports: 
      - ${IP}:9100:9100
    pid: host
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    cap_add:
      - SYS_TIME
    #network_mode: service:prometheus-agent
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 40s 
