services: 
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
#    hostname: prometheus
    restart: unless-stopped
#    networks:
#      - prometheus
    network_mode: service:tailscale-prometheus
    depends_on:
      node_exporter:
        condition: service_healthy
      tailscale-prometheus:
        condition: service_healthy
#    ports: 
#      - 9090:9090
    volumes: 
      - ${PWD}/prometheus/config:/etc/prometheus
      - ${PWD}/prometheus/data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 40s 

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
#    hostname: node_exporter
    command:
      - '--path.rootfs=/host'
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
#      - "--collector.openrc"
      - "--collector.processes"
      - "--collector.filesystem.ignored-mount-points"
      - "^/(rootfs/)?(dev|etc|host|proc|run|sys)($$|/)"
    network_mode: service:tailscale-prometheus
    depends_on:
      tailscale-prometheus:
        condition: service_healthy
#    networks:
#      - prometheus
#    ports: 
#      - 9100:9100
    pid: host
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    cap_add:
      - SYS_TIME
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 40s


  tailscale-prometheus:
    image: tailscale/tailscale:latest
    container_name: tailscale-prometheus
    environment:
      - TS_AUTHKEY=${TS_KEY_PROMETHEUS}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_SERVE_CONFIG=/config/prometheus.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=prometheus
      # - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41236       # The <addr>:<port> for the healthz endpoint
    volumes:
      - ${PWD}/tailscale-prometheus/state:/var/lib/tailscale
      - ${PWD}/tailscale-prometheus/config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    network_mode: host
    # networks:
    #  - ...
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41236/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: unless-stopped

